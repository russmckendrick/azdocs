[package]
name = "azdocs-desktop"
version = "0.1.0"
description = "Desktop explorer for azdocs Azure estate snapshots"
authors = ["azdocs contributors"]
edition = "2024"

[lib]
name = "azdocs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
azdocs = { path = "../.." }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = { workspace = true }
tokio = { workspace = true }
# no-serde-warnings: ts-rs warns on every build about serde attributes it does
# not understand, and `deny_unknown_fields` is one of them. That attribute is
# deliberate on the IPC input types — it makes a typo in a request fail loudly
# rather than being silently ignored — so the warning is noise on every
# `tauri dev` rebuild, not a signal.
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSError", "NSString", "NSData", "NSDictionary", "NSURL", "NSURLRequest"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSBitmapImageRep", "NSImageRep"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration", "WKNavigationDelegate", "WKNavigationAction", "WKNavigationResponse", "WKNavigation", "WKUIDelegate", "WKFrameInfo", "WKSecurityOrigin"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }
cairo-rs = { version = "0.18", features = ["png"] }
