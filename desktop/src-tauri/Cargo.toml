[package]
name = "azdocs-desktop"
version = "0.1.0"
description = "Desktop explorer for azdocs Azure estate snapshots"
authors = ["azdocs contributors"]
edition = "2024"

[lib]
name = "azdocs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
azdocs = { path = "../.." }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = { workspace = true }
tokio = { workspace = true }
