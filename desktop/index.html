<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f8fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1420" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: light)" href="../docs/marks/assets/azdocs-app-icon-light.svg" />
    <link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: dark)" href="../docs/marks/assets/azdocs-app-icon-dark.svg" />
    <title>azdocs — Azure estate explorer</title>
    <script>
      // Apply a stored explicit theme before first paint so the app never
      // flashes the wrong mode; "system" leaves prefers-color-scheme in charge.
      try {
        // preferences.ts stores JSON; a bare value from an older build still reads.
        var read = function (key) {
          var raw = localStorage.getItem(key);
          try { return JSON.parse(raw); } catch (error) { return raw; }
        };
        var theme = read("azdocs-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
        var scale = Number(read("azdocs-ui-scale"));
        if (scale >= 1 && scale <= 1.5) {
          document.documentElement.style.setProperty("--ui-scale", String(scale));
        }
      } catch (error) {
        // Storage may be unavailable; the app applies preferences on load.
      }
    </script>
  </head>
  <body>
    <!--
    The desktop app is a premium desktop data application: a dark navy
    navigation frame in both modes, a cool neutral workspace, restrained
    Azure blue, Inter throughout, and colour reserved for data and signals.
    The full sheet lives at docs/reference/design.md.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
