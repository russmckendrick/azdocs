<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)" />
    <title>azdocs — Azure estate explorer</title>
    <script>
      // Apply a stored explicit theme before first paint so the app never
      // flashes the wrong mode; "system" leaves prefers-color-scheme in charge.
      try {
        var theme = localStorage.getItem("azdocs-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (error) {
        /* storage may be unavailable; the system preference still applies */
      }
    </script>
  </head>
  <body>
    <!--
    The desktop app wears the "Field Report" design language: the printed
    estate report made interactive. IBM Plex Serif for identity, Sans for the
    work, Mono for machine-shaped evidence; paper surfaces with hairline rules
    in light, a warm-charcoal token remap in dark. The full sheet lives at
    docs/reference/design.md.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
