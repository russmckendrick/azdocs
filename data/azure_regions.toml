# Azure region catalogue: display name, physical location, geography and
# coordinates for every region azdocs can place on a map. Generated from
# Microsoft's Azure regions list and datacenter map; refresh with:
#   cargo run --example update_azure_locations
#
# `source` records where the coordinates came from: "datacenter-map" is
# Microsoft's published latitude/longitude; "physical-location" is the
# approximate centre of the city the regions list names, for the
# restricted-access regions the map omits. Regions without coordinates
# are not listed here; azure_locations.toml still names them.
# `availability_zones` and `paired_region` follow the regions list;
# `open`, `year_opened` and `data_residency` follow the datacenter map.

