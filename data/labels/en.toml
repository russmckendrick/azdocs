significance = "Expiry can remove an approved exception; an expired record alone does not establish a resource violation."
verification = "Confirm exemption scope, owner, justification and expiry with the policy owner."
policy = "Renew only justified exceptions or remediate affected resources; use the recorded snapshot date."
action = "Review exemption expiry with policy owners"
source = "https://learn.microsoft.com/en-us/azure/governance/policy/samples/resource-graph-samples"

[report.assessment.checks.vms_without_azure_backup]
title = "VMs without observed active Azure Backup protection"
observation = "No accessible AzureIaasVM protected item in the Protected state matched the VM ARM ID."
significance = "This is absence of observed active Azure Backup evidence, not proof that the VM has no backup. Other products, inaccessible vaults or delayed ARG indexing can explain it."
verification = "Verify access to all relevant vaults, protection state, recovery points, restore tests and any third-party backup solution."
policy = "Apply workload recovery requirements and documented exceptions; do not infer protection from vault existence."
action = "Verify VM backup coverage and recovery evidence"
