[report.assessment.checks.sql_public_network_access]
title = "Database public-network configuration"
observation = "The audit recorded database services whose public-network access setting was enabled or treated as enabled by the collected rule."
significance = "A public service endpoint expands the set of possible access paths. Authentication, firewall rules and service-specific controls still determine which requests succeed; an enabled setting is not proof of unrestricted internet access."
verification = "Review publicNetworkAccess, firewall and virtual-network rules, private endpoints and the clients using each service. Test intended access paths before restricting the public endpoint."
policy = "Confirm whether each workload requires public access and record the approved network boundary. Treat missing properties and default assumptions in the original rule as verification items."
action = "Review database network boundaries"
source = "https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-firewall"

[report.assessment.checks.storage_public_blob_access]
title = "Storage anonymous-access permission"
observation = "The audit recorded storage accounts with the account-level permission for anonymous blob access enabled."
significance = "This permits containers to be configured for anonymous access. It does not establish that any container or blob is currently public; container access level and network controls also matter."
verification = "Inspect container access levels and known anonymous consumers. Disable the account permission where anonymous delivery is not intended, after validating dependent services."
policy = "Public content delivery may be intentional. Document its scope and separate it from confidential data rather than treating every permitted account as a confirmed disclosure."
action = "Verify storage anonymous-access requirements"
source = "https://learn.microsoft.com/en-us/azure/storage/blobs/anonymous-read-access-configure"

[report.assessment.checks.disks_unencrypted_or_pmk]
title = "Disk encryption key ownership"
observation = "The audit recorded managed disks using platform-managed encryption keys. These disks are encrypted at rest."
significance = "Platform-managed encryption is an Azure encryption option. Customer-managed keys add control and operational responsibility; their absence does not establish that a disk is unencrypted."
verification = "Confirm whether policy requires customer-managed keys or double encryption. If it does, review disk encryption sets, key permissions, rotation and recovery before planning a change."
policy = "Treat this as a key-management policy decision. Retain the recorded medium severity as audit history without presenting it as proof of missing encryption."
action = "Confirm the disk key-management policy"
source = "https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption"

[report.assessment.checks.keyvault_no_purge_protection]
title = "Key Vault purge protection"
observation = "The audit recorded vaults without purge protection enabled."
significance = "Purge protection affects the ability to permanently delete soft-deleted vault data. A missing safeguard can make accidental or unauthorised deletion harder to recover from."
verification = "Check soft-delete retention, purge protection and the services relying on these keys and secrets. Validate the intended retention before enabling an irreversible protection setting."
policy = "Agree retention and deletion responsibilities, including keys used to encrypt other services."
action = "Review vault deletion safeguards"
source = "https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview"

[report.assessment.checks.keyvault_public_access]
title = "Key Vault network boundary"
observation = "The audit recorded vault network settings that allow a public endpoint with a permissive default network action."
significance = "Network access and permission to read a secret are separate controls. Review the network boundary alongside authentication and authorisation rather than describing the vault contents as publicly readable."
verification = "Check firewall exceptions, private endpoints, DNS and applications that use the vault. Confirm intended access before narrowing network rules."
policy = "Record approved clients and network access paths, including management and recovery access."
action = "Review vault network access"
source = "https://learn.microsoft.com/en-us/azure/key-vault/general/network-security"

[report.assessment.checks.public_ip_exposed_resources]
title = "Resources associated with public IPs"
observation = "The audit recorded resources attached to public IP addresses."
significance = "A public IP provides a possible ingress or egress endpoint. It does not by itself establish which ports are reachable or which service is exposed."
verification = "Trace each address to its NIC, load balancer or gateway and review network rules, listeners and intended clients. Verify effective exposure before changing the address."
policy = "Public endpoints may be intentional. Record ownership and the expected exposed service."
action = "Trace and verify public endpoints"
source = "https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses"

[report.assessment.checks.unassociated_nsgs]
title = "Network security groups without an association"
observation = "The audit recorded network security groups without a NIC or subnet association."
significance = "An unassociated NSG is not enforcing rules on those resources. It may be intentionally staged or left behind; the record does not establish that another resource lacks protection."
verification = "Confirm whether the NSG is referenced by deployment templates or planned changes. Identify an owner before attaching or removing it."
policy = "Review lifecycle and deployment ownership; do not infer cost savings from this inventory alone."
action = "Confirm the purpose of unassociated NSGs"
source = "https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview"

