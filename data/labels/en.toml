# Labels are data: every user-facing string azdocs prints, draws or exports.
#
# Placeholders are {snake_case} and are filled by the code that owns the
# string; plurals are `{ one = "...", other = "..." }` tables. A string that
# starts or ends with a space keeps it — some of these are fragments joined
# around a value. Section names mirror the surface that reads them.
#
# User overrides: drop a partial file at <config dir>/azdocs/labels/en.toml
# (or <name>.toml, selected with `[branding] labels = "<name>"`); its keys are
# deep-merged over these built-ins. Unknown keys are an error.

