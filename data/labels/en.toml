significance = "LRS does not provide the zone or regional resilience of other replication choices. It may be appropriate for disposable or reproducible data."
verification = "Check service and region support, data criticality, recovery requirements and migration constraints."
policy = "Select redundancy against the workload recovery objectives and cost; this is not a universal policy violation."
action = "Review storage redundancy requirements"
