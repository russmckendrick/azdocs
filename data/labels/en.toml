note = "Assignment inventory includes the requested inherited scope. Enforcement mode and excluded scopes affect interpretation; an assignment does not establish a passing evaluation."

[report.posture.datasets.policy_definitions]
title = "Policy definition inventory"
note = "Definitions retain their original rule, parameters and metadata in the detailed evidence. Counts do not indicate that every definition is assigned."

[report.posture.datasets.policy_initiatives]
title = "Policy initiative inventory"
note = "Initiatives retain the complete definition-reference array. Definition counts and evaluated-resource counts are different measures."

[report.posture.datasets.role_assignments]
title = "Azure RBAC assignments"
note = "Assignments are grouped by recorded role ID and principal type. Scope and conditions remain in detailed evidence; this is not an effective-access or PIM eligibility calculation."

[report.posture.datasets.role_definitions]
title = "Azure RBAC role definitions"
note = "Role definitions preserve Actions, NotActions, DataActions and NotDataActions. Custom permissions must be reviewed together with assignable scopes and actual assignments."

[report.posture.datasets.patch_assessments]
title = "Patch assessments"
note = "Counts describe pending updates at the recorded assessment time and may overlap across classifications. Missing counts remain unknown. ARG assessment history is limited to seven days."

[report.posture.datasets.patch_installations]
title = "Patch installation outcomes"
note = "Each row is an installation run, not a unique machine. Successful runs, failures and warnings remain separate; ARG installation history is limited to 30 days."

[report.posture.datasets.guest_configuration_assignments]
title = "Guest configuration results"
note = "Guest assignments describe observed VM and Arc OS baseline results. Pending or missing results do not establish compliance; details retain the provider report when available."

[report.posture.datasets.backup_protected_items]
title = "Backup protection evidence"
note = "Protection state, backup status and recovery-point time are separate evidence. Missing fields remain unknown; the age threshold is a configurable review aid, not a workload RPO."

[report.posture.datasets.backup_policies]
title = "Backup policies"
note = "Schedules and retention structures remain in the original policy evidence. The presence of a policy does not establish successful backups or tested recovery."

[report.posture.datasets.backup_jobs]
title = "Backup and restore outcomes"
note = "Backup and restore jobs retain the provider status, including warnings. ARG exposes up to 14 days of jobs; an empty result does not prove successful backups."

[report.posture.datasets.defender_assessments]
title = "Defender recommendations"
note = "Assessments describe security recommendations and their recorded state. Overlap with regulatory controls is expected; these totals must not be added as independent findings."

[report.posture.datasets.defender_subassessments]
title = "Defender detailed occurrences"
note = "Subassessments are detailed occurrences linked to a parent assessment. Preserve that relationship when prioritising remediation."

[report.posture.datasets.defender_active_alerts]
title = "Active Defender alerts"
note = "Alerts retain their recorded severity and all resource identifiers. An alert can affect multiple assets; absence of alerts does not establish detection coverage."

[report.posture.datasets.defender_secure_score_controls]
title = "Defender secure-score control evidence"
note = "Counts are resource occurrences across controls and can overlap. Original scores and denominators remain in detailed evidence; no average compliance score is inferred."

[report.posture.datasets.resource_health]
title = "Resource availability"
note = "Availability states describe observed provider status. Unknown or missing health records are not healthy results and this table is not an uptime measure."

[report.posture.datasets.service_health_events]
title = "Active Service Health events"
note = "Active subscription-scoped incidents, maintenance and advisories are retained. Emerging issues without subscription IDs are outside ARG coverage."

[report.posture.datasets.resource_changes]
title = "Recent ARM changes"
note = "Recorded ARM changes can include actor, client and changed properties. ARG retains 14 days; this is not a complete activity or data-plane audit log."

[report.posture.datasets.policy_evaluation_coverage]
title = "Policy evaluation coverage"
note = "Assignments are matched to stored policy states using full normalised ARM IDs. No observed evaluation is kept separate from compliance and from unavailable state collection."

[report.posture.datasets.patch_evaluation_coverage]
title = "Machine assessment coverage"
note = "Counts use the collected VM and Arc inventory, deduplicated by full ARM ID. No observed assessment may indicate missing service configuration, access or expired evidence; it is not a passed patch check."

[report.posture.datasets.evidence_freshness]
title = "Evidence age at collection"
note = "Ages are evaluated at the snapshot timestamp using the threshold recorded with each query. Future, invalid and missing dates stay separate. Review thresholds are configurable and are not Microsoft retention guarantees."

