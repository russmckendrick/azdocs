significance = "An empty plan may retain paid capacity or be reserved for an upcoming deployment."
verification = "Check deployment slots, automation, ownership and intended capacity before removal."
policy = "Retain only justified standby capacity; validate the billing impact."
action = "Review empty paid App Service plans"
