[report.posture.datasets.policy_states]
title = "Azure Policy evaluation states"
note = "Counts are policy evaluations, not distinct resources. Recorded states stay separate; missing evaluations never imply compliance. Full assignment and initiative IDs identify each group. A missing initiative may indicate a standalone policy or missing evidence."

[report.posture.datasets.policy_exemptions]
title = "Azure Policy exemptions"
note = "Expiry is assessed at collection time. Review expired exemptions and those due within 90 days with their owners. No expiry specified does not mean permanent approval; assignment scope and justification remain in the stored evidence."

[report.posture.datasets.defender_compliance_standards]
title = "Defender regulatory standards"
note = "Standard states across accessible subscriptions. Detailed control counts remain in the stored evidence. Missing or unsupported coverage does not establish compliance or certification."

[report.posture.datasets.defender_compliance_controls]
title = "Defender regulatory controls"
note = "Control states across accessible subscriptions, grouped by standard. Skipped, unsupported and unknown states remain distinct from passes. Full control IDs remain in the stored evidence."

[report.posture.datasets.defender_compliance_assessments]
title = "Defender regulatory assessments"
note = "Passed, failed and skipped counts are resource occurrences across assessments; resources can be counted more than once. Missing counts remain unknown. These assessments do not establish certification or compliance of unassessed resources."

[report.assessment.checks.stopped_allocated_vms]
