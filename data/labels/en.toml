[report.assessment.checks.web_app_https_only_disabled]
title = "Web applications allowing HTTP"
observation = "The audit recorded web applications that do not enforce HTTPS-only access."
significance = "Applications may accept requests over HTTP unless another layer redirects or blocks them. Review the complete ingress path, including proxies and custom domains."
verification = "Test HTTP and HTTPS behaviour, redirects and dependent clients. Enable HTTPS-only where required after confirming certificates and client compatibility."
policy = "Define transport requirements for public and private application endpoints."
action = "Verify application HTTPS enforcement"
source = "https://learn.microsoft.com/en-us/azure/app-service/configure-ssl-bindings"

[report.assessment.checks.storage_http_allowed]
title = "Storage transport enforcement"
observation = "The audit recorded storage accounts that do not require secure transfer."
significance = "Without secure-transfer enforcement, compatible clients may use unencrypted transport. The setting does not tell us whether clients actually do so."
verification = "Review clients, HTTPS use and the secure-transfer setting before enforcing encrypted transport."
policy = "Require encrypted transport for data in transit and record any compatibility exception with an owner and review date."
action = "Review storage secure-transfer enforcement"
source = "Source: the original stored finding and its collection-time query evidence."

[report.assessment.checks.storage_weak_tls]
title = "Storage TLS configuration"
observation = "The audit recorded storage accounts with a minimum TLS setting below the rule's expected level."
significance = "A lower minimum TLS setting can allow older client protocols. It describes the permitted protocol floor, not the protocol negotiated by current clients."
verification = "Check the effective TLS requirement and client compatibility, then apply the organisation's supported minimum."
policy = "Set the supported protocol floor and plan client upgrades before changing an account used by older integrations."
action = "Review storage TLS requirements"
source = "Source: the original stored finding and its collection-time query evidence."

[report.assessment.checks.web_app_weak_tls_or_ftps]
title = "Web application TLS and deployment transport"
observation = "The audit recorded web applications with TLS or FTPS settings flagged by the rule."
significance = "Application traffic and deployment traffic have separate transport controls. A finding in either setting needs verification against the clients and deployment tools that use that endpoint."
verification = "Review minimum TLS, SCM deployment access and FTPS policy with application and deployment owners."
policy = "Define requirements for both application and deployment endpoints, including how exceptions and legacy clients will be retired."
action = "Review application and deployment transport"
source = "Source: the original stored finding and its collection-time query evidence."

[report.assessment.checks.aks_public_api_server]
title = "Kubernetes API endpoint configuration"
observation = "The audit recorded AKS clusters with a public API endpoint."
significance = "The Kubernetes API is a management endpoint. A public address increases the need to verify permitted network sources and authentication; it does not imply anonymous administrative access."
verification = "Check authorised IP ranges, identity controls and administrative access paths before changing the endpoint."
policy = "Agree how administrators and deployment systems should reach the API, including authorised source networks and emergency access."
action = "Review Kubernetes administrative access"
source = "Source: the original stored finding and its collection-time query evidence."

[report.assessment.checks.aks_rbac_disabled]
title = "Kubernetes role-based access control"
observation = "The audit recorded AKS clusters whose RBAC setting was flagged as disabled."
significance = "Kubernetes role-based access control governs permissions inside the cluster. Its configuration needs a separate review from Azure permissions over the AKS resource."
verification = "Verify Kubernetes RBAC, Microsoft Entra integration and administrative identities against cluster policy."
policy = "Define least-privilege roles for cluster users and service accounts, with a controlled process for privileged administration."
action = "Verify Kubernetes access controls"
source = "Source: the original stored finding and its collection-time query evidence."

[report.assessment.checks.nsg_open_to_internet]
title = "Internet-sourced network security rules"
observation = "The audit recorded network security rules matching the audit's internet-access criteria."
significance = "A matching rule may permit internet-sourced traffic, but priority, association, destination and other controls determine the effective path. The stored rule alone does not establish end-to-end reachability."
verification = "Review rule priority, direction, ports, source ranges and effective rules on associated NICs and subnets."
policy = "Document permitted public entry points and restrict administrative access to approved paths; verify dependencies before changing rules."
action = "Verify internet-sourced NSG rules"
source = "Source: the original stored finding and its collection-time query evidence."

[report.assessment.checks.vms_without_managed_disks]
title = "Virtual-machine disk management"
observation = "The audit recorded virtual machines whose disks were flagged as unmanaged."
significance = "Disk management affects the storage lifecycle and the options available for operating the virtual machine. The finding does not establish backup status or whether a migration will preserve all dependencies."
verification = "Confirm the disk configuration, migration compatibility and backup dependencies before planning migration."
policy = "Agree the supported disk model and a migration, validation and rollback approach with the workload owner."
action = "Review virtual-machine disk management"
source = "Source: the original stored finding and its collection-time query evidence."

[report.assessment.checks.orphaned_resources]
title = "Resources without an expected attachment"
observation = "The audit recorded resources that the audit considered unattached or orphaned."
significance = "An absent attachment may indicate abandoned infrastructure, a staged deployment or deliberate standby capacity. Configuration alone cannot establish that deletion is safe or quantify savings."
verification = "Check deployment ownership and recent usage before removing anything; establish actual billing impact separately."
policy = "Require an owner, dependency review and retention decision before removal; verify costs using billing evidence."
action = "Review ownership of unattached resources"
source = "Source: the original stored finding and its collection-time query evidence."

[report.assessment.checks.missing_required_tags]
title = "Missing required resource tags"
observation = "The audit recorded resources missing at least one tag required by the collection-time audit."
significance = "Missing classification keys make ownership and cost allocation harder to establish. A present key may still hold an empty or unsuitable value, so key presence alone does not establish useful classification."
verification = "Use the stored missing-key evidence to identify owners and correct omissions; do not substitute today's tag policy."
policy = "Use the collection-time missing keys as evidence and confirm the current required keys, accepted values and exception process with their owners."
action = "Resolve historical required-tag omissions"
source = "Source: the original stored finding and its collection-time query evidence."

[report.assessment.checks.unknown]
title = "Recorded configuration check"
observation = "The original audit recorded the observations shown below."
significance = "This check is not in the built-in guidance catalogue. Its stored title and evidence require review in the context of the query used at collection time."
verification = "Review the original evidence and obtain the query definition used for this snapshot before deciding whether a change is required."
policy = "No control assurance or remediation requirement is inferred from a custom check name."
action = "Review the original check evidence"
source = "Source: the original stored finding and its collection-time query evidence."

