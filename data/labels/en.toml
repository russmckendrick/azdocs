[report.assessment.checks.unassociated_ddos_plans]
title = "DDoS plans without associations"
observation = "The plan returned an explicitly empty virtual-network association list."
significance = "An unused or staged plan can retain cost; shared or planned use may justify keeping it."
verification = "Confirm complete scope visibility, ownership, planned deployment and billing before changing the plan."
policy = "Review intended protection coverage and commercial commitments before removal."
action = "Review unassociated DDoS plans"
source = "https://github.com/microsoft/finops-toolkit/tree/dev/src/templates/finops-hub/modules/Microsoft.FinOpsHubs/Recommendations/queries"

[report.assessment.checks.unprovisioned_expressroute_circuits]
title = "ExpressRoute provider provisioning"
observation = "The circuit reported a non-empty service-provider state other than Provisioned."
significance = "Provisioning may be incomplete or intentionally in transition; the observation does not measure traffic or cost."
verification = "Confirm the provider order, circuit state, deployment plan and billing arrangements."
policy = "Treat as an operational and cost review candidate, not automatic waste."
action = "Review ExpressRoute provisioning"
source = "https://github.com/microsoft/finops-toolkit/tree/dev/src/templates/finops-hub/modules/Microsoft.FinOpsHubs/Recommendations/queries"

[report.assessment.checks.vnet_gateways_without_connections]
title = "Gateways without observed connections"
observation = "No accessible connection resources matched the gateway and no point-to-site address pool was configured."
significance = "The gateway may be staged, disconnected or used through configuration outside the accessible scope."
verification = "Review point-to-site use, all connection scopes, intended deployment and telemetry before making changes."
policy = "Configuration absence is not proof of idle traffic or a safe deletion candidate."
action = "Review gateway purpose and connections"
source = "https://github.com/microsoft/finops-toolkit/tree/dev/src/templates/finops-hub/modules/Microsoft.FinOpsHubs/Recommendations/queries"

