# Consultancy audit report. Centred cover with a hairline rule, chapter
# divider pages, generous whitespace, and tables ruled horizontally only.
#
# Palette values are expressions over the [branding] colours: a literal
# `#rrggbb`, a reference (`$primary` / `$accent`), or one call — `lighten`,
# `darken`, `mix`, `readable_on`. See docs/reference/themes.md.

description = "Consultancy audit report: editorial cover, divider pages, hairline tables."

[palette]
primary = "darken($primary, 0.25)"
primary_dark = "darken($primary, 0.45)"
primary_tint = "lighten($primary, 0.92)"
accent = "$accent"
accent_tint = "lighten($accent, 0.9)"
on_primary = "readable_on(darken($primary, 0.25))"
band = "#ffffff"
on_band = "#12121c"
ink = "#12121c"
muted = "#70707a"
rule = "#c9c9d2"
surface = "#ffffff"
# Unused (zebra_rows = false), but kept resolvable so a user override that
# switches zebra on gets a sane fill rather than an error.
zebra = "#f6f6f8"

[palette.severity.high]
text = "#8c1d21"
fill = "#f3dcdc"

[palette.severity.medium]
text = "#7a4600"
fill = "#f6e6d4"

[palette.severity.low]
text = "#5f4e00"
fill = "#f4efd9"

[palette.severity.info]
text = "#2c4a63"
fill = "#e4ebf1"

[typography]
sans = "IBM Plex Sans"
mono = "IBM Plex Mono"
docx_sans = "Calibri"
docx_mono = "Consolas"
base_pt = 10.0
small_pt = 8.0
table_pt = 7.5
table_header_pt = 7.5
title_pt = 26.0
subtitle_pt = 12.0
h1_pt = 17.0
h2_pt = 12.5
h3_pt = 10.5
stat_value_pt = 20.0
stat_label_pt = 7.0
line_height = 1.5

[layout]
cover = "editorial"
table = "hairline"
stat = "bare"
heading_numbering = true
divider_pages = true
running_header = true
zebra_rows = false
rule_pt = 0.4
radius_pt = 0.0
table_inset_pt = 5.0
cover_band_pt = 0.0
