# Azure-native. Colour band cover, filled table headers, zebra rows.
# Reads like a first-party Microsoft document.
#
# Palette values are expressions over the [branding] colours: a literal
# `#rrggbb`, a reference (`$primary` / `$accent`), or one call — `lighten`,
# `darken`, `mix`, `readable_on`. See docs/reference/themes.md.

description = "Azure-native: colour band cover, filled table headers, zebra rows."

[palette]
primary = "$primary"
primary_dark = "darken($primary, 0.18)"
primary_tint = "lighten($primary, 0.88)"
accent = "$accent"
accent_tint = "lighten($accent, 0.85)"
on_primary = "readable_on($primary)"
band = "$primary"
on_band = "readable_on($primary)"
ink = "#1a1a2e"
muted = "#65656f"
rule = "#d9d9e0"
surface = "#ffffff"
zebra = "lighten($primary, 0.95)"

[palette.severity.high]
text = "#a4262c"
fill = "#f8cecc"

[palette.severity.medium]
text = "#8a5300"
fill = "#ffe6cc"

[palette.severity.low]
text = "#6f5b00"
fill = "#fff2cc"

[palette.severity.info]
text = "darken($primary, 0.25)"
fill = "lighten($primary, 0.85)"

[typography]
sans = "IBM Plex Sans"
mono = "IBM Plex Mono"
docx_sans = "Calibri"
docx_mono = "Consolas"
base_pt = 10.0
small_pt = 8.0
table_pt = 7.5
table_header_pt = 8.0
title_pt = 30.0
subtitle_pt = 13.0
h1_pt = 18.0
h2_pt = 13.0
h3_pt = 11.0
stat_value_pt = 19.0
stat_label_pt = 7.5
line_height = 1.4

[layout]
cover = "band"
table = "solid-header"
stat = "card"
heading_numbering = true
divider_pages = false
running_header = true
zebra_rows = true
rule_pt = 0.5
radius_pt = 4.0
table_inset_pt = 4.5
cover_band_pt = 96.0
