name = "messaging_services"
category = "integration"
kind = "inventory"
resource_types = ["microsoft.eventhub/namespaces", "microsoft.servicebus/namespaces", "microsoft.eventgrid/topics", "microsoft.eventgrid/domains"]
resource_table = true
description = "Event Hubs, Service Bus and Event Grid namespaces, topics and domains with SKU, TLS floor and network posture"
kql = '''
resources
| where type in ("microsoft.eventhub/namespaces", "microsoft.servicebus/namespaces",
                 "microsoft.eventgrid/topics", "microsoft.eventgrid/domains")
| project id, name, type, location, resourceGroup, subscriptionId,
          sku = tostring(sku.name),
          tier = tostring(sku.tier),
          publicNetworkAccess = tostring(properties.publicNetworkAccess),
          disableLocalAuth = properties.disableLocalAuth,
          minimumTlsVersion = tostring(properties.minimumTlsVersion),
          zoneRedundant = properties.zoneRedundant,
          endpoint = tostring(coalesce(properties.serviceBusEndpoint, properties.endpoint))
| order by id asc
'''
