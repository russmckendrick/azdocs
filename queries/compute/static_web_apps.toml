name = "static_web_apps"
category = "compute"
kind = "inventory"
resource_types = ["microsoft.web/staticsites"]
resource_table = true
description = "Static Web Apps with hostname, source repository, and network access"
kql = '''
resources
| where type == "microsoft.web/staticsites"
| project id, name, location, resourceGroup, subscriptionId,
          skuName = tostring(sku.name),
          defaultHostname = tostring(properties.defaultHostname),
          repositoryUrl = tostring(properties.repositoryUrl),
          branch = tostring(properties.branch),
          provider = tostring(properties.provider),
          customDomainCount = array_length(properties.customDomains),
          stagingEnvironmentPolicy = tostring(properties.stagingEnvironmentPolicy),
          publicNetworkAccess = tostring(properties.publicNetworkAccess)
| order by id asc
'''
