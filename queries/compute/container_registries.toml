name = "container_registries"
category = "compute"
kind = "inventory"
description = "Container registries with SKU, admin user, anonymous pull, public network and zone redundancy posture"
kql = '''
resources
| where type == "microsoft.containerregistry/registries"
| project id, name, location, resourceGroup, subscriptionId,
          sku = tostring(sku.name),
          loginServer = tostring(properties.loginServer),
          adminUserEnabled = properties.adminUserEnabled,
          anonymousPullEnabled = properties.anonymousPullEnabled,
          publicNetworkAccess = tostring(properties.publicNetworkAccess),
          defaultNetworkAction = tostring(properties.networkRuleSet.defaultAction),
          zoneRedundancy = tostring(properties.zoneRedundancy),
          privateEndpointCount = coalesce(array_length(properties.privateEndpointConnections), 0),
          dataEndpointEnabled = properties.dataEndpointEnabled
| order by id asc
'''
