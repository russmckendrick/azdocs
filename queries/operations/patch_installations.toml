# Source: https://learn.microsoft.com/en-us/azure/update-manager/query-logs
# Retain all available summary jobs, including success and warnings. ARG installation history is limited to 30 days.
name = "patch_installations"
category = "operations"
kind = "inventory"
resource_id_field = "resourceId"
description = "VM and Arc update installations with outcomes, patch counts and reboot state"
kql = '''
// Retain all available summary jobs, including success and warnings. ARG installation history is limited to 30 days.
patchinstallationresources
| where type in~ ('microsoft.compute/virtualmachines/patchinstallationresults', 'microsoft.hybridcompute/machines/patchinstallationresults')
| project id, name, subscriptionId, resourceGroup,
          resourceId = tostring(split(tolower(id), '/patchinstallationresults/')[0]),
          startedAt = properties.startDateTime, updatedAt = properties.lastModifiedDateTime,
          status = tostring(properties.status), osType = tostring(properties.osType),
          installedPatches = toint(properties.installedPatchCount), failedPatches = toint(properties.failedPatchCount),
          pendingPatches = toint(properties.pendingPatchCount), rebootStatus = tostring(properties.rebootStatus),
          maintenanceWindowExceeded = tobool(properties.maintenanceWindowExceeded), errorDetails = properties.errorDetails
| order by id asc
'''

[source]
urls = ["https://learn.microsoft.com/en-us/azure/update-manager/query-logs"]
reviewed_on = "2026-09-13"
