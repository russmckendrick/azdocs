name = "network_security_groups"
category = "networking"
kind = "inventory"
description = "NSGs with rule counts and attachment summary"
kql = '''
resources
| where type == "microsoft.network/networksecuritygroups"
| project id, name, location, resourceGroup, subscriptionId,
          ruleCount = array_length(properties.securityRules),
          attachedSubnets = array_length(properties.subnets),
          attachedNics = array_length(properties.networkInterfaces)
| order by id asc
'''
