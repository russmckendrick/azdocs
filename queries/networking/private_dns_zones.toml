name = "private_dns_zones"
category = "networking"
kind = "inventory"
resource_types = ["microsoft.network/privatednszones"]
resource_table = true
description = "Private DNS zones with record and VNet link counts"
kql = '''
resources
| where type == "microsoft.network/privatednszones"
| project id, name, resourceGroup, subscriptionId,
          recordSets = properties.numberOfRecordSets,
          vnetLinks = properties.numberOfVirtualNetworkLinks
| order by id asc
'''
