name = "synapse_workspaces"
category = "analytics"
kind = "inventory"
resource_types = ["microsoft.synapse/workspaces"]
resource_table = true
description = "Synapse workspaces with managed VNet and network access settings"
kql = '''
resources
| where type == "microsoft.synapse/workspaces"
| project id, name, location, resourceGroup, subscriptionId,
          managedResourceGroupName = tostring(properties.managedResourceGroupName),
          sqlAdministratorLogin = tostring(properties.sqlAdministratorLogin),
          managedVirtualNetwork = tostring(properties.managedVirtualNetwork),
          publicNetworkAccess = tostring(properties.publicNetworkAccess),
          identityType = tostring(identity.type)
| order by id asc
'''
