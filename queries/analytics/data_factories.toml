name = "data_factories"
category = "analytics"
kind = "inventory"
description = "Data Factory instances with Git integration and network access"
kql = '''
resources
| where type == "microsoft.datafactory/factories"
| project id, name, location, resourceGroup, subscriptionId,
          version = tostring(properties.version),
          publicNetworkAccess = tostring(properties.publicNetworkAccess),
          repoType = tostring(properties.repoConfiguration.type),
          repoAccountName = tostring(properties.repoConfiguration.accountName),
          repoRepositoryName = tostring(properties.repoConfiguration.repositoryName),
          repoCollaborationBranch = tostring(properties.repoConfiguration.collaborationBranch),
          encryptionKeyName = tostring(properties.encryption.keyName),
          identityType = tostring(identity.type)
| order by id asc
'''
