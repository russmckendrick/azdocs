name = "storage_accounts"
category = "storage"
kind = "inventory"
description = "Storage accounts with SKU, access tier, and network rules"
kql = '''
resources
| where type == "microsoft.storage/storageaccounts"
| project id, name, location, resourceGroup, subscriptionId,
          sku = tostring(sku.name), kind,
          accessTier = tostring(properties.accessTier),
          httpsOnly = properties.supportsHttpsTrafficOnly,
          minimumTlsVersion = tostring(properties.minimumTlsVersion),
          allowBlobPublicAccess = properties.allowBlobPublicAccess,
          publicNetworkAccess = tostring(properties.publicNetworkAccess),
          defaultNetworkAction = tostring(properties.networkAcls.defaultAction),
          ipRuleCount = coalesce(array_length(properties.networkAcls.ipRules), 0),
          vnetRuleCount = coalesce(array_length(properties.networkAcls.virtualNetworkRules), 0),
          privateEndpointCount = coalesce(array_length(properties.privateEndpointConnections), 0),
          allowSharedKeyAccess = properties.allowSharedKeyAccess
| order by id asc
'''
