# Adapted from https://github.com/microsoft/finops-toolkit/tree/dev/src/templates/finops-hub/modules/Microsoft.FinOpsHubs/Recommendations/queries
name = "orphaned_nat_gateways"
category = "cost"
kind = "finding"
description = "NAT gateways without an associated subnet"
severity = "low"
title_field = "summary"
kql = '''
resources
| where type =~ 'microsoft.network/natgateways'
| where coalesce(array_length(properties.subnets), 0) == 0
| project id, name, resourceGroup, subscriptionId,
          summary = strcat(name, " has no associated subnet")
| order by id asc
'''

