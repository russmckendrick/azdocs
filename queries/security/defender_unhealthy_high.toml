name = "defender_unhealthy_high"
category = "security"
kind = "finding"
severity = "high"
title_field = "summary"
resource_id_field = "resourceId"
description = "Defender for Cloud recommendations in an unhealthy state at high severity"
kql = '''
// Evidence rows keep the assessment id for paging; the affected resource is the finding target.
securityresources
| where type =~ 'microsoft.security/assessments'
| where properties.status.code =~ 'Unhealthy' and properties.metadata.severity =~ 'High'
| project id, name, subscriptionId, resourceGroup,
          resourceId = tostring(properties.resourceDetails.Id),
          displayName = tostring(properties.displayName),
          summary = strcat(tostring(properties.displayName), " is unhealthy")
| order by id asc
'''

[source]
urls = ["https://learn.microsoft.com/en-us/azure/defender-for-cloud/resource-graph-samples"]
reviewed_on = "2026-09-19"
