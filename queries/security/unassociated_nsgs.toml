name = "unassociated_nsgs"
category = "security"
kind = "finding"
severity = "info"
title_field = "summary"
description = "NSGs not associated with any subnet or network interface"
kql = '''
resources
| where type == "microsoft.network/networksecuritygroups"
| where coalesce(array_length(properties.networkInterfaces), 0) == 0
  and coalesce(array_length(properties.subnets), 0) == 0
| project id, name, resourceGroup, subscriptionId,
          summary = strcat(name, " is not associated with any subnet or NIC")
| order by id asc
'''
