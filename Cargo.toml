[workspace]
members = ["desktop/src-tauri"]

# Shared across the CLI and the desktop app. Declaring them once is what keeps
# the two crates on a single resolution graph: before this, two lockfiles drifted
# to 51 different crate versions, so `cargo test` validated a different azdocs
# core than the desktop actually linked and shipped.
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order is load-bearing (column order in reports and query output, which
# the golden tests pin). The desktop crate must inherit it rather than declare a
# bare `serde_json = "1"` that silently drops the feature.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[package]
name = "azdocs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.9"
comfy-table = "8.0.0"
crossterm = "0.29.0"
csv = "1.4.0"
dialoguer = "0.12.0"
directories = "6.0.0"
docx-rs = "0.4"
# Already in the tree via docx-rs; taken as a direct dependency so the DOCX
# emitter can validate a user-supplied logo before handing it to `Pic::new`,
# which panics on an image it cannot decode.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
include_dir = "0.7.4"
indicatif = "0.18.6"
minijinja = { version = "2.24.0", features = ["loader"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
quick-xml = "0.41.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "gzip", "http2", "charset", "form"] }
resvg = { version = "0.47", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
rusqlite = { version = "0.40.2", features = ["bundled", "serde_json"] }
rust_xlsxwriter = "0.98.1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
thiserror = { workspace = true }
tokio = { workspace = true }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
typst = "0.13"
typst-assets = { version = "0.13", features = ["fonts"] }
typst-pdf = "0.13"
usvg = "0.47"
uuid = { version = "1.24.1", features = ["v4"] }

[dev-dependencies]
insta = { version = "1.48.0", features = ["json", "yaml", "filters"] }
lopdf = "0.44.0"
tempfile = "3.27.0"
wiremock = "0.6.5"
zip = "4"

# Debug-mode rasterisation is unusably slow without optimising the pixel
# pipeline; these only affect dev builds of the named dependencies.
[profile.dev.package.tiny-skia]
opt-level = 2
[profile.dev.package.resvg]
opt-level = 2
[profile.dev.package.usvg]
opt-level = 2
[profile.dev.package.rustybuzz]
opt-level = 2
[profile.dev.package.ttf-parser]
opt-level = 2
[profile.dev.package.fontdb]
opt-level = 2
[profile.dev.package.png]
opt-level = 2
