version: 2
# Routine version-update pull requests are disabled. Dependencies are refreshed
# together and validated locally so one maintenance change replaces a stream of
# separately billed CI runs. Dependabot security updates are configured
# separately in repository settings and are not affected by this limit.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
