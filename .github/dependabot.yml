version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]
    # resvg and usvg are lockstep-released; a grouped update keeps them together.
    # typst crates are pinned to one minor and bumped by hand.
    ignore:
      - dependency-name: "typst*"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
