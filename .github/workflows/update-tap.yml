name: Update Homebrew tap

on:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish. Defaults to the latest GitHub release.
        required: false
        type: string

permissions:
  contents: read

jobs:
  update-tap:
    name: Update formula and cask
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${REQUESTED_TAG}"
          if [ -z "${TAG}" ]; then
            TAG=$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${TAG}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

      - name: Download published checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          for FILE in azdocs-darwin-amd64.tar.gz.sha256 azdocs-darwin-arm64.tar.gz.sha256 azdocs-linux-amd64.tar.gz.sha256 azdocs-linux-arm64.tar.gz.sha256 azdocs-desktop-macos-arm64.dmg.sha256; do
            gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${FILE}" --dir build
          done

      - name: Check out Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: Write formula and cask
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          DARWIN_AMD64_SHA=$(cut -d' ' -f1 build/azdocs-darwin-amd64.tar.gz.sha256)
          DARWIN_ARM64_SHA=$(cut -d' ' -f1 build/azdocs-darwin-arm64.tar.gz.sha256)
          LINUX_AMD64_SHA=$(cut -d' ' -f1 build/azdocs-linux-amd64.tar.gz.sha256)
          LINUX_ARM64_SHA=$(cut -d' ' -f1 build/azdocs-linux-arm64.tar.gz.sha256)
          DESKTOP_DMG_SHA=$(cut -d' ' -f1 build/azdocs-desktop-macos-arm64.dmg.sha256)

          cd homebrew-tap
          mkdir -p Formula Casks

          cat > Formula/azdocs.rb << EOF
          class Azdocs < Formula
            desc "Audit, explore and document Azure estates from local snapshots"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${RELEASE_VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/azdocs-darwin-arm64.tar.gz"
                sha256 "${DARWIN_ARM64_SHA}"
              else
                url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/azdocs-darwin-amd64.tar.gz"
                sha256 "${DARWIN_AMD64_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/azdocs-linux-arm64.tar.gz"
                sha256 "${LINUX_ARM64_SHA}"
              else
                url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/azdocs-linux-amd64.tar.gz"
                sha256 "${LINUX_AMD64_SHA}"
              end
            end

            def install
              bin.install "azdocs"
              prefix.install "LICENSE", "THIRD_PARTY_NOTICES.md"
              prefix.install "data", "docs"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/azdocs --version")
            end
          end
          EOF

          cat > Casks/azdocs-desktop.rb << EOF
          cask "azdocs-desktop" do
            version "${RELEASE_VERSION}"
            sha256 "${DESKTOP_DMG_SHA}"

            url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/azdocs-desktop-macos-arm64.dmg"
            name "azdocs"
            desc "Desktop explorer for offline Azure estate snapshots"
            homepage "https://github.com/${GITHUB_REPOSITORY}"

            depends_on arch: :arm64

            livecheck do
              url :url
              strategy :github_latest
            end

            app "azdocs.app"
          end
          EOF

      - name: Validate and publish tap changes
        working-directory: homebrew-tap
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          ruby -c Formula/azdocs.rb
          ruby -c Casks/azdocs-desktop.rb

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -- Formula/azdocs.rb Casks/azdocs-desktop.rb
          if git diff --cached --quiet; then
            echo "Homebrew tap is already current."
            exit 0
          fi
          git commit -m "Add azdocs ${RELEASE_TAG}"
          git push
