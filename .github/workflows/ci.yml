name: "🧪 CI"

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

# Every job gets read-only repository access; nothing in CI writes back.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Large report dependencies exhausted the Linux runner during cache cleanup.
  # Keep CI artifacts small; local development still includes full debug info.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  docs:
    name: "📚 Documentation"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "🐍 Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: "🔗 Check documentation"
        run: python3 docs/development/tools/check_docs.py
      - name: "🎨 Check design sheet"
        run: python3 docs/reference/tools/build_design_sheet.py --check

  test:
    name: "🦀 Test · ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "🦀 Set up Rust"
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: "⚡ Restore Rust cache"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust-no-debuginfo
      # --all covers every workspace member; the desktop crate is checked here
      # so the Tauri job does not need to reinstall a toolchain to format it.
      - name: "✨ Check formatting"
        run: cargo fmt --all --check
      - name: "📎 Run Clippy"
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: "🧪 Run tests"
        run: cargo test --locked
      - name: "🔐 Test native credential storage · macOS / Windows"
        if: runner.os != 'Linux'
        run: cargo test --locked --test credential_store_test -- --ignored
      - name: "🔑 Install Linux credential service"
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring
      - name: "🔐 Test native credential storage · Linux"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -c '
            printf "%s" "azdocs-ci-disposable" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --locked --test credential_store_test -- --ignored
          '
      - name: "💽 Report Linux disk usage before cache cleanup"
        if: always() && runner.os == 'Linux'
        run: |
          df -h .
          if [ -d target ]; then du -sh target; fi

  desktop:
    name: "🖥️ Desktop · ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "🦀 Set up Rust"
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - name: "📦 Set up pnpm"
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - name: "🟢 Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: "🐧 Install Tauri system dependencies"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      # Both jobs use the workspace lockfile; each keeps its own build cache.
      - name: "⚡ Restore Rust cache"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust-no-debuginfo
      - name: "📦 Install frontend dependencies"
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: "🧹 Lint frontend"
        working-directory: desktop
        run: pnpm run lint
      - name: "🔤 Typecheck frontend"
        working-directory: desktop
        run: pnpm run typecheck
      - name: "🧪 Test frontend"
        working-directory: desktop
        run: pnpm test
      - name: "🏗️ Build frontend"
        working-directory: desktop
        run: pnpm run build
      - name: "📎 Run Clippy on desktop backend"
        run: cargo clippy -p azdocs-desktop --all-targets --locked -- -D warnings
      # The topology invariant (drawn + folded + aggregated == total) is only
      # actually enforced if these run. They did not run until now.
      # This also regenerates desktop/src/generated.ts from the DTOs and
      # desktop/src/generated-labels.json from data/labels/en.toml.
      - name: "🧪 Test desktop backend"
        run: cargo test -p azdocs-desktop --locked
      - name: "📸 Native screenshot smoke test · Linux"
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo run -p azdocs-desktop --locked --example website_capture_smoke
      - name: "📸 Native screenshot smoke test · macOS / Windows"
        if: runner.os != 'Linux'
        run: cargo run -p azdocs-desktop --locked --example website_capture_smoke
      - name: "🖼️ Upload native capture evidence"
        id: capture-evidence
        if: always()
        # Evidence retention must not skip contract checks when storage is full.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: website-capture-${{ matrix.os }}
          path: output/website-smoke/
          retention-days: 7
      - name: "⚠️ Report unavailable capture evidence"
        if: always() && steps.capture-evidence.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Native capture evidence could not be uploaded. Check artifact storage quota; smoke test results remain blocking."
          echo "Native capture evidence upload failed; see the upload step for details. Smoke test results remain blocking." >> "$GITHUB_STEP_SUMMARY"
      - name: "🔄 Check generated TypeScript is current"
        shell: bash
        run: |
          if ! git diff --exit-code -- desktop/src/generated.ts desktop/src/generated-labels.json; then
            echo "::error::desktop/src/generated.ts or generated-labels.json is stale."
            echo "Run 'cargo test -p azdocs-desktop' and commit the result."
            exit 1
          fi
      - name: "💽 Report Linux disk usage before cache cleanup"
        if: always() && runner.os == 'Linux'
        run: |
          df -h .
          if [ -d target ]; then du -sh target; fi

  deny:
    name: "🚫 Dependency policy"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Advisories, the licence allowlist, duplicate-version bans and the
      # registry allowlist, from deny.toml. A new dependency clears all four.
      - name: "🚫 Run cargo-deny"
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          # The default graph, as `cargo deny check` runs locally; features
          # no build enables are not shipped and not policed.
          arguments: --workspace

  audit-frontend:
    name: "🔍 Frontend audit"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "📦 Set up pnpm"
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - name: "🟢 Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: "📦 Install frontend dependencies"
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: "🔍 Audit frontend dependencies"
        working-directory: desktop
        run: pnpm audit --audit-level=high

  notices:
    name: "📜 Licence notices"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "🦀 Set up Rust"
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: "🧰 Install cargo-about"
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: cargo-about@0.9.2
      - name: "📦 Fetch locked dependencies"
        run: cargo fetch --locked
      # The same report the release ships; failing here means a new crate's
      # licence is unknown or outside about.toml, which is a PR-time question.
      - name: "⚖️ Check every crate licence is known and accepted"
        run: cargo about generate --offline --locked --fail docs/licenses/about.hbs -o /dev/null
      - name: "📦 Set up pnpm"
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - name: "🟢 Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: "📦 Install frontend dependencies"
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: "⚖️ Check the frontend licence report is current"
        working-directory: desktop
        run: node scripts/frontend-licenses.mjs --check

  msrv:
    name: "🧓 Minimum supported Rust"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "🦀 Set up Rust 1.89"
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.89"
      # The workspace includes the Tauri backend, whose Linux build links
      # WebKitGTK; the check is meaningless without those libraries.
      - name: "🐧 Install Tauri system dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: "⚡ Restore Rust cache"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust-msrv
      # rust-version in Cargo.toml is a claim; this is the check behind it.
      - name: "🧪 Check the workspace builds on the floor"
        run: cargo check --workspace --all-targets --locked

  test-musl:
    name: "🐧 Test · musl ${{ matrix.arch }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "🦀 Set up Rust target"
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: "🐧 Install musl tools"
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: "⚡ Restore Rust cache"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust-musl-${{ matrix.arch }}
      # The release ships musl on Linux; the test matrix above is glibc. Run
      # the CLI suite on the target that ships, natively on each architecture.
      - name: "🧪 Run tests on the release target"
        run: cargo test --locked --target ${{ matrix.target }}

  coverage:
    name: "📊 Coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "🦀 Set up Rust"
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - name: "🧰 Install cargo-llvm-cov"
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: cargo-llvm-cov
      # The workspace includes the Tauri backend, whose Linux build links
      # WebKitGTK; the check is meaningless without those libraries.
      - name: "🐧 Install Tauri system dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: "⚡ Restore Rust cache"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-rust-coverage
      - name: "📊 Measure line coverage"
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: "📈 Summarise"
        run: cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "⬆️ Upload lcov report"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14
