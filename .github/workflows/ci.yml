name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # --all covers every workspace member; the desktop crate is checked here
      # so the Tauri job does not need to reinstall a toolchain to format it.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  desktop:
    name: Desktop (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Single workspace root since desktop/src-tauri joined the workspace, so
      # this shares a cache and a lockfile with the job above.
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        working-directory: desktop
        run: pnpm run lint
      - name: Typecheck frontend
        working-directory: desktop
        run: pnpm run typecheck
      - name: Test frontend
        working-directory: desktop
        run: pnpm test
      - name: Build frontend
        working-directory: desktop
        run: pnpm run build
      - name: Clippy desktop backend
        run: cargo clippy -p azdocs-desktop --all-targets --locked -- -D warnings
      # The topology invariant (drawn + folded + aggregated == total) is only
      # actually enforced if these run. They did not run until now.
      # This also regenerates desktop/src/generated.ts from the DTOs and
      # desktop/src/generated-labels.json from data/labels/en.toml.
      - name: Test desktop backend
        run: cargo test -p azdocs-desktop --locked
      - name: Check generated TypeScript is current
        run: |
          if ! git diff --exit-code -- desktop/src/generated.ts desktop/src/generated-labels.json; then
            echo "::error::desktop/src/generated.ts or generated-labels.json is stale."
            echo "Run 'cargo test -p azdocs-desktop' and commit the result."
            exit 1
          fi
