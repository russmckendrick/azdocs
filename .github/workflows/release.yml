name: "🚀 Release"

on:
  push:
    tags: ["v*"]

# Read-only by default; the publish job alone writes the release, and the
# packaging jobs request the OIDC token they need to attest what they built.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: "🧪 Full CI"
    uses: ./.github/workflows/ci.yml

  release-metadata:
    name: "🔎 Validate release metadata"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "🏷️ Match tag, package versions and release notes"
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ROOT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          DESKTOP_CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/src-tauri/Cargo.toml | head -n 1)
          DESKTOP_PACKAGE_VERSION=$(node -p "require('./desktop/package.json').version")
          TAURI_VERSION=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")

          for ENTRY in "Cargo.toml:${ROOT_VERSION}" "desktop/src-tauri/Cargo.toml:${DESKTOP_CARGO_VERSION}" "desktop/package.json:${DESKTOP_PACKAGE_VERSION}" "desktop/src-tauri/tauri.conf.json:${TAURI_VERSION}"; do
            FILE="${ENTRY%%:*}"
            VERSION="${ENTRY#*:}"
            if [ "${VERSION}" != "${TAG_VERSION}" ]; then
              echo "${FILE} version ${VERSION} does not match ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          done

          test -s "docs/releases/${TAG_VERSION}.md"
          echo "version=${TAG_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: "🌍 Require a public release repository"
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "${REPOSITORY_PRIVATE}" = "true" ]; then
            echo "Homebrew cannot install GitHub release assets from a private repository." >&2
            echo "Make the repository public before publishing a release tag." >&2
            exit 1
          fi

      - name: "🔐 Require publishing credentials"
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          MISSING=0
          for SECRET_NAME in APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD HOMEBREW_TAP_DEPLOY_KEY; do
            if [ -z "${!SECRET_NAME}" ]; then
              echo "Missing required GitHub Actions secret: ${SECRET_NAME}" >&2
              MISSING=1
            fi
          done
          exit "${MISSING}"

  notices:
    name: "📜 Generate dependency licence notices"
    needs: [ci, release-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "🦀 Set up Rust"
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: "🧰 Install cargo-about"
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: cargo-about@0.9.2
      - name: "📦 Fetch locked dependencies"
        run: cargo fetch --locked
      - name: "⚖️ Generate notices from the locked CLI dependency graph"
        run: |
          mkdir -p output/licenses
          cargo about generate --offline --locked --fail docs/licenses/about.hbs -o output/licenses/dependency-licenses.html
      - name: "⬆️ Upload dependency notices"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-notices
          path: output/licenses/dependency-licenses.html
          if-no-files-found: error

  cli:
    name: "⌨️ CLI · ${{ matrix.archive }}"
    needs: notices
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: azdocs-darwin-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: azdocs-darwin-amd64.tar.gz
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: azdocs-linux-amd64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: azdocs-linux-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: azdocs-windows-amd64.zip
    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "🦀 Set up Rust target"
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: "🐧 Install musl tools"
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: "⚡ Restore Rust cache"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: "🏗️ Build release CLI"
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: "⬇️ Download dependency notices"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dependency-notices
          path: target/${{ matrix.target }}/release/package
      - name: "🧳 Stage executable and notices"
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="target/${{ matrix.target }}/release/package"
          BINARY=azdocs
          if [ "${RUNNER_OS}" = "Windows" ]; then BINARY=azdocs.exe; fi

          mkdir -p "${PACKAGE}/data/fonts" "${PACKAGE}/docs/licenses"
          cp "target/${{ matrix.target }}/release/${BINARY}" "${PACKAGE}/"
          cp LICENSE THIRD_PARTY_NOTICES.md "${PACKAGE}/"
          cp data/fonts/OFL.txt "${PACKAGE}/data/fonts/"
          cp docs/licenses/Microsoft-MIT.txt docs/licenses/typst-assets-NOTICE.txt "${PACKAGE}/docs/licenses/"
      - name: "📦 Package and checksum · Unix"
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="target/${{ matrix.target }}/release"
          tar czf "${{ matrix.archive }}" -C "${RELEASE_DIR}/package" .
          shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
      - name: "📦 Package and checksum · Windows"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/package/*" -DestinationPath "${{ matrix.archive }}"
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.archive }}").Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Out-File -Encoding ascii "${{ matrix.archive }}.sha256"
      # A software bill of materials for what the archive contains, and a
      # signed provenance statement tying it to this workflow run, so a
      # downloaded archive can be checked with `gh attestation verify`.
      - name: "🧾 Generate SBOM"
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: target/${{ matrix.target }}/release/package
          format: spdx-json
          output-file: ${{ matrix.archive }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: "🔏 Attest build provenance"
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ matrix.archive }}
      - name: "⬆️ Upload CLI archive"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-cli-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
            ${{ matrix.archive }}.spdx.json

  desktop-macos:
    name: "🍎 Desktop · macOS arm64 DMG"
    needs: [ci, release-metadata, notices]
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      DESKTOP_DMG: azdocs-desktop-macos-arm64.dmg
    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "🦀 Set up Rust target"
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin
      - name: "⚡ Restore Rust cache"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: "📦 Set up pnpm"
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
          run_install: false
      - name: "🟢 Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: "📦 Install desktop dependencies"
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: "⬇️ Download dependency notices"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dependency-notices
          path: output/licenses
      - name: "⚖️ Check the frontend licence report is current"
        working-directory: desktop
        run: node scripts/frontend-licenses.mjs --check
      - name: "🔏 Import Apple Developer certificate"
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="${RUNNER_TEMP}/certificate.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/azdocs-signing.keychain-db"

          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${CERTIFICATE_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -k "${KEYCHAIN_PATH}" -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          IDENTITIES=$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" || true)
          printf '%s\n' "${IDENTITIES}"
          CERT_ID=$(printf '%s\n' "${IDENTITIES}" | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -n 1)
          if [ -z "${CERT_ID}" ]; then
            echo "The certificate secret does not contain a Developer ID Application identity." >&2
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=${CERT_ID}" >> "${GITHUB_ENV}"
      - name: "🔑 Configure App Store Connect API key"
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${APPLE_API_ISSUER}" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "APPLE_API_ISSUER must be the App Store Connect issuer UUID." >&2
            exit 1
          fi
          if ! printf '%s' "${APPLE_API_PRIVATE_KEY}" | grep -q "BEGIN PRIVATE KEY"; then
            echo "APPLE_API_PRIVATE_KEY must contain an App Store Connect AuthKey .p8 file." >&2
            exit 1
          fi

          API_KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "${APPLE_API_PRIVATE_KEY}" > "${API_KEY_PATH}"
          chmod 600 "${API_KEY_PATH}"
          echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}" >> "${GITHUB_ENV}"
          echo "APPLE_API_KEY=${APPLE_API_KEY}" >> "${GITHUB_ENV}"
          echo "APPLE_API_KEY_PATH=${API_KEY_PATH}" >> "${GITHUB_ENV}"
      - name: "🏗️ Build signed and notarized DMG"
        working-directory: desktop
        run: pnpm tauri build --target aarch64-apple-darwin --bundles dmg --ci --config '{"bundle":{"resources":{"../../output/licenses/dependency-licenses.html":"notices/dependency-licenses.html"}}}'
      - name: "✅ Verify signed and notarized app"
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(find target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -type f | head -n 1)
          test -n "${DMG}"
          codesign --verify --verbose=2 "${DMG}"

          MOUNT_DIR=$(mktemp -d "${RUNNER_TEMP}/azdocs-dmg.XXXXXX")
          hdiutil attach "${DMG}" -readonly -nobrowse -mountpoint "${MOUNT_DIR}"
          trap 'hdiutil detach "${MOUNT_DIR}" -quiet || true' EXIT

          APP="${MOUNT_DIR}/azdocs.app"
          if [ ! -d "${APP}" ]; then
            echo "Mounted DMG does not contain azdocs.app" >&2
            find "${MOUNT_DIR}" -maxdepth 2 -print >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${APP}"
          xcrun stapler validate "${APP}"
          spctl -a -vv -t execute "${APP}"
      - name: "🧹 Normalize desktop artifact"
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(find target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -type f | head -n 1)
          cp "${DMG}" "${DESKTOP_DMG}"
          shasum -a 256 "${DESKTOP_DMG}" > "${DESKTOP_DMG}.sha256"
      - name: "🔏 Attest build provenance"
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ env.DESKTOP_DMG }}
      - name: "⬆️ Upload macOS desktop package"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-desktop-macos-arm64
          if-no-files-found: error
          path: |
            ${{ env.DESKTOP_DMG }}
            ${{ env.DESKTOP_DMG }}.sha256

  desktop-windows:
    name: "🪟 Desktop · Windows amd64"
    needs: [ci, release-metadata, notices]
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      DESKTOP_SETUP: azdocs-desktop-windows-amd64-setup.exe
      DESKTOP_MSI: azdocs-desktop-windows-amd64.msi
      # Azure Trusted Signing is optional: when the endpoint secret is unset
      # the installers ship unsigned and SmartScreen warns, which the
      # installation guide explains. Setting the four secrets turns signing on.
      TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "🦀 Set up Rust"
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: "⚡ Restore Rust cache"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: "📦 Set up pnpm"
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
          run_install: false
      - name: "🟢 Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: "📦 Install desktop dependencies"
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: "🏗️ Build desktop installers"
        working-directory: desktop
        run: pnpm tauri build --bundles nsis,msi --ci --config '{"bundle":{"resources":{"../../output/licenses/dependency-licenses.html":"notices/dependency-licenses.html"}}}'
      - name: "🔑 Sign in to Azure for Trusted Signing"
        if: env.TRUSTED_SIGNING_ENDPOINT != ''
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TRUSTED_SIGNING_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_TRUSTED_SIGNING_SUBSCRIPTION_ID }}
      - name: "🔏 Sign installers with Azure Trusted Signing"
        if: env.TRUSTED_SIGNING_ENDPOINT != ''
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: target/release/bundle
          files-folder-filter: exe,msi
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: "⚠️ Note unsigned installers"
        if: env.TRUSTED_SIGNING_ENDPOINT == ''
        shell: bash
        run: |
          echo "::notice::Windows installers are unsigned: AZURE_TRUSTED_SIGNING_ENDPOINT is not configured. SmartScreen will warn on first run."
          echo "Windows installers in this release are **unsigned** (no Trusted Signing secrets configured); SmartScreen will warn on first run. See docs/usage/installation.md." >> "$GITHUB_STEP_SUMMARY"
      - name: "🧹 Normalize desktop artifacts"
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          $msi = Get-ChildItem -Path "target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $setup -or -not $msi) {
            throw "Tauri did not produce both NSIS and MSI installers"
          }

          Copy-Item $setup.FullName "${{ env.DESKTOP_SETUP }}"
          Copy-Item $msi.FullName "${{ env.DESKTOP_MSI }}"
          foreach ($file in @("${{ env.DESKTOP_SETUP }}", "${{ env.DESKTOP_MSI }}")) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            "$hash  $file" | Out-File -Encoding ascii "$file.sha256"
          }
      - name: "🔏 Attest build provenance"
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ env.DESKTOP_SETUP }}
            ${{ env.DESKTOP_MSI }}
      - name: "⬆️ Upload Windows desktop packages"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-desktop-windows-amd64
          if-no-files-found: error
          path: |
            ${{ env.DESKTOP_SETUP }}
            ${{ env.DESKTOP_SETUP }}.sha256
            ${{ env.DESKTOP_MSI }}
            ${{ env.DESKTOP_MSI }}.sha256

  desktop-linux:
    name: "🐧 Desktop · Linux ${{ matrix.arch }}"
    needs: [ci, release-metadata, notices]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "🦀 Set up Rust"
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: "🧰 Install Tauri Linux packaging dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - name: "⚡ Restore Rust cache"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: "📦 Set up pnpm"
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
          run_install: false
      - name: "🟢 Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: "📦 Install desktop dependencies"
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: "⬇️ Download dependency notices"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dependency-notices
          path: output/licenses
      - name: "⚖️ Check the frontend licence report is current"
        working-directory: desktop
        run: node scripts/frontend-licenses.mjs --check
      - name: "🏗️ Build desktop packages"
        working-directory: desktop
        run: pnpm tauri build --bundles appimage,deb,rpm --ci --config '{"bundle":{"resources":{"../../output/licenses/dependency-licenses.html":"notices/dependency-licenses.html"}}}'
      - name: "🧹 Normalize desktop artifacts"
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE=$(find target/release/bundle/appimage -name '*.AppImage' -type f | head -n 1)
          DEB=$(find target/release/bundle/deb -name '*.deb' -type f | head -n 1)
          RPM=$(find target/release/bundle/rpm -name '*.rpm' -type f | head -n 1)
          test -n "${APPIMAGE}" && test -n "${DEB}" && test -n "${RPM}"

          cp "${APPIMAGE}" "azdocs-desktop-linux-${{ matrix.arch }}.AppImage"
          cp "${DEB}" "azdocs-desktop-linux-${{ matrix.arch }}.deb"
          cp "${RPM}" "azdocs-desktop-linux-${{ matrix.arch }}.rpm"
          sha256sum "azdocs-desktop-linux-${{ matrix.arch }}.AppImage" "azdocs-desktop-linux-${{ matrix.arch }}.deb" "azdocs-desktop-linux-${{ matrix.arch }}.rpm" > "azdocs-desktop-linux-${{ matrix.arch }}.sha256"
      - name: "🔏 Attest build provenance"
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            azdocs-desktop-linux-${{ matrix.arch }}.AppImage
            azdocs-desktop-linux-${{ matrix.arch }}.deb
            azdocs-desktop-linux-${{ matrix.arch }}.rpm
      - name: "⬆️ Upload Linux desktop packages"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-desktop-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            azdocs-desktop-linux-${{ matrix.arch }}.AppImage
            azdocs-desktop-linux-${{ matrix.arch }}.deb
            azdocs-desktop-linux-${{ matrix.arch }}.rpm
            azdocs-desktop-linux-${{ matrix.arch }}.sha256

  publish:
    name: "📦 Publish GitHub release"
    needs:
      - release-metadata
      - cli
      - desktop-macos
      - desktop-windows
      - desktop-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "⬇️ Download release packages"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          merge-multiple: true
      - name: "🧮 Consolidate checksums"
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -name '*.sha256' ! -name 'azdocs-checksums.sha256' -print0 | sort -z | xargs -0 cat > azdocs-checksums.sha256
      - name: "🎉 Create GitHub release"
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: docs/releases/${{ needs.release-metadata.outputs.version }}.md
          fail_on_unmatched_files: true
          files: |
            azdocs-*.tar.gz
            azdocs-*.zip
            azdocs-desktop-*.dmg
            azdocs-desktop-*.exe
            azdocs-desktop-*.msi
            azdocs-desktop-*.AppImage
            azdocs-desktop-*.deb
            azdocs-desktop-*.rpm
            *.sha256
            *.spdx.json

  update-tap:
    name: "🍺 Publish Homebrew formula and cask"
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/update-tap.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit
