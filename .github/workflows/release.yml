name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  notices:
    name: Generate dependency licence notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - run: cargo fetch --locked
      - name: Generate notices from the locked CLI dependency graph
        run: |
          mkdir -p output/licenses
          cargo about generate --offline --locked --fail docs/licenses/about.hbs -o output/licenses/dependency-licenses.html
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-notices
          path: output/licenses/dependency-licenses.html
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: notices
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: dependency-notices
          path: target/${{ matrix.target }}/release/package
      - name: Stage executable and notices
        shell: bash
        run: |
          package="target/${{ matrix.target }}/release/package"
          binary=azdocs
          if [ "$RUNNER_OS" = "Windows" ]; then binary=azdocs.exe; fi
          mkdir -p "$package/data/fonts" "$package/docs/licenses"
          cp "target/${{ matrix.target }}/release/$binary" "$package/"
          cp LICENSE THIRD_PARTY_NOTICES.md "$package/"
          cp data/fonts/OFL.txt "$package/data/fonts/"
          cp docs/licenses/Microsoft-MIT.txt docs/licenses/typst-assets-NOTICE.txt "$package/docs/licenses/"
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf azdocs-${{ matrix.target }}.tar.gz -C package .
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/package/* `
            -DestinationPath target/${{ matrix.target }}/release/azdocs-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: azdocs-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/azdocs-*.tar.gz
            target/${{ matrix.target }}/release/azdocs-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: azdocs-*
          merge-multiple: true
      - name: Checksum release archives
        run: sha256sum azdocs-*.tar.gz azdocs-*.zip > azdocs-checksums.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: azdocs-*
          generate_release_notes: true
